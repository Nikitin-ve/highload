<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Key-Value Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="forms-row">
      <!-- GET Form -->
      <form id="getForm" class="key-value-form">
        <h3>GET Request</h3>
        <div class="form-group">
          <label for="getKey">Key:</label>
          <input type="text" id="getKey" required>
        </div>
        <button type="button" id="getButton">Get Value</button>
        <div class="result" id="getResult"></div>
      </form>

      <!-- POST Form -->
      <form id="postForm" class="key-value-form">
        <h3>POST Request</h3>
        <div class="form-group">
          <label for="postKey">Key:</label>
          <input type="text" id="postKey" required>
        </div>
        <div class="form-group">
          <label for="postValue">Value:</label>
          <input type="text" id="postValue" required>
        </div>
        <button type="button" id="postButton">Set Value</button>
        <div class="result" id="postResult"></div>
      </form>

      <!-- DELETE Form -->
      <form id="deleteForm" class="key-value-form">
        <h3>DELETE Request</h3>
        <div class="form-group">
          <label for="deleteKey">Key:</label>
          <input type="text" id="deleteKey" required>
        </div>
        <button type="button" id="deleteButton">Delete Key</button>
        <div class="result" id="deleteResult"></div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
